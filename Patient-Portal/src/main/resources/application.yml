spring:
  datasource:
    # La ruta de tu base de datos (creará la base de datos automáticamente si no existe)
    url: jdbc:mysql://localhost:3306/rednorte_portal_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: "" # Pon tu contraseña de MySQL aquí si tienes una. Si usas XAMPP, déjalo vacío.
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'update' es la magia que crea o actualiza las tablas automáticamente leyendo tus Entities
      ddl-auto: update 
    # Muestra en la consola el código SQL que Spring Boot escribe por nosotros
    show-sql: true 
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# Opcional: Para cambiar el puerto si alguna vez necesitas (ahora mismo ya usa el 8084 por tu código, pero es buena práctica tenerlo aquí)
server:
  port: 8084