spring.application.name=AutoReasign-Service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/reasignacion_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpassword


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

resilience4j.circuitbreaker.instances.citaMedicaCB.sliding-window-size=8
resilience4j.circuitbreaker.instances.citaMedicaCB.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.citaMedicaCB.wait-duration-in-open-state=10s
