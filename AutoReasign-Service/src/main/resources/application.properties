server.port=8083
spring.application.name=auto-reasign-service

spring.datasource.url=jdbc:mysql://localhost:3306/db_reasignacion?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

resilience4j.circuitbreaker.instances.citaMedicaCB.sliding-window-size=8
resilience4j.circuitbreaker.instances.citaMedicaCB.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.citaMedicaCB.wait-duration-in-open-state=10s

springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.server.servlet-context-path=/
