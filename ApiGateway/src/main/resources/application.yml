server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: bff-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/bff/**

        - id: patient-portal-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/portal/** 

        - id: waitlist-service
          uri: http://localhost:8081 
          predicates:
            - Path=/api/espera/**

        - id: auto-reasign-service
          uri: http://localhost:8083 
          predicates:
            - Path=/api/reasignacion/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000" 
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"