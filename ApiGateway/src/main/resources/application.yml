server:
  port: 8080 # El puerto del Gateway (al que llama React)

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        # 1. TU RUTA: Microservicio de Lista de Espera
        - id: waitlist-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/espera/**
            
        # 2. RUTA DE BENJAMÍN: Microservicio del Portal Paciente
        - id: patient-portal
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/portal/**