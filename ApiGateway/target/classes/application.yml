server:
  port: 8080 # El puerto principal al que se conectará el Frontend

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Ruta hacia nuestro Patient Portal Service
        - id: patient-portal-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/portal/** # Todo lo que empiece así, mándalo al 8084