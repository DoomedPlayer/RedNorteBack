spring.application.name=BFF
server.port=8082

resilience4j.circuitbreaker.instances.dashboardCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.dashboardCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.dashboardCB.wait-duration-in-open-state=15s

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG