spring.application.name=Waitlist-Service
server.port=8081

# Conexión a MySQL (Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/rednorte_waitlist?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

resilience4j.circuitbreaker.instances.waitlistCB.sliding-window-size=8
resilience4j.circuitbreaker.instances.waitlistCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.waitlistCB.wait-duration-in-open-state=12s