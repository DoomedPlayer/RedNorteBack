services:
  mysql-db:
    image: mysql:8.0
    container_name: rednorte_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - rednorte-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_service
    ports:
      - "5672:5672"   
      - "15672:15672" 
    networks:
      - rednorte-network

  auth-service:
    build: .
    container_name: auth_service
    restart: on-failure
    volumes:
      - ./security/target/security-0.0.1-SNAPSHOT.jar:/app/app.jar
    command: java -jar /app/app.jar
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/db_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - API_SECURITY_JWT_SECRET=T1VaRzZ4bU03T1B5bkhsWEtKVXo5Z01DckJWaTJGQ3E4RjNEOWEyYjVjN2UxZjRk
      - api.security.jwt.secret=T1VaRzZ4bU03T1B5bkhsWEtKVXo5Z01DckJWaTJGQ3E4RjNEOWEyYjVjN2UxZjRk
      - api.security.jwt.expiration=86400000
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - rednorte-network

  patient-portal:
    build: .
    container_name: patient_portal_service
    restart: on-failure
    volumes:
      - ./Patient-Portal/target/patient-portal-service-0.0.1-SNAPSHOT.jar:/app/app.jar
    command: java -jar /app/app.jar
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/db_patient_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - api.security.jwt.secret=T1VaRzZ4bU03T1B5bkhsWEtKVXo5Z01DckJWaTJGQ3E4RjNEOWEyYjVjN2UxZjRk
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - rednorte-network

  waitlist-service:
    build: .
    container_name: waitlist_service
    restart: on-failure
    volumes:
      - ./waitlist-service/target/Waitlist-Service-0.0.1-SNAPSHOT.jar:/app/app.jar
    command: java -jar /app/app.jar
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/db_waitlist?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - api.security.jwt.secret=T1VaRzZ4bU03T1B5bkhsWEtKVXo5Z01DckJWaTJGQ3E4RjNEOWEyYjVjN2UxZjRk
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - rednorte-network

  auto-reasign-service:
    build: .
    container_name: auto_reasign_service
    restart: on-failure
    volumes:
      - ./AutoReasign-Service/target/AutoReasign-Service-0.0.1-SNAPSHOT.jar:/app/app.jar
    command: java -jar /app/app.jar
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/db_reasignacion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - api.security.jwt.secret=T1VaRzZ4bU03T1B5bkhsWEtKVXo5Z01DckJWaTJGQ3E4RjNEOWEyYjVjN2UxZjRk
    depends_on:
      mysql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      
    networks:
      - rednorte-network

  bff-service:
    build: .
    container_name: bff_service
    volumes:
      - ./BFF/target/BFF-0.0.1-SNAPSHOT.jar:/app/app.jar
    command: java -jar /app/app.jar
    ports:
      - "8082:8082"
    environment:
      - PATIENT_PORTAL_URI=http://patient-portal:8084
      - WAITLIST_URI=http://waitlist-service:8081
      - API_SECURITY_JWT_SECRET=T1VaRzZ4bU03T1B5bkhsWEtKVXo5Z01DckJWaTJGQ3E4RjNEOWEyYjVjN2UxZjRk
      - api.security.jwt.secret=T1VaRzZ4bU03T1B5bkhsWEtKVXo5Z01DckJWaTJGQ3E4RjNEOWEyYjVjN2UxZjRk
    depends_on:
      - patient-portal
      - waitlist-service
    networks:
      - rednorte-network

  api-gateway:
    build: .
    container_name: api_gateway
    volumes:
      - ./ApiGateway/target/api-gateway-0.0.1-SNAPSHOT.jar:/app/app.jar
    command: java -jar /app/app.jar
    ports:
      - "8080:8080"
    networks:
      - rednorte-network

volumes:
  mysql_data:

networks:
  rednorte-network:
    driver: bridge